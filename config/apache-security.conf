# Dipasang sebagai conf-enabled/zz-security.conf.

ServerTokens Prod
ServerSignature Off
TraceEnable Off

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always unset X-Powered-By
</IfModule>

<Directory "/var/www/html">
    Options -Indexes
</Directory>

# XML-RPC jarang dipakai dan sering jadi sasaran brute force.
<Files "xmlrpc.php">
    Require all denied
</Files>

# File sensitif dan info versi.
<FilesMatch "^(wp-config\.php|wp-config-docker\.php|readme\.html|license\.txt|\.user\.ini)$">
    Require all denied
</FilesMatch>

# File yang diupload user tidak boleh dieksekusi sebagai PHP.
<Directory "/var/www/html/wp-content/uploads">
    <FilesMatch "\.(?i:php\d*|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>
