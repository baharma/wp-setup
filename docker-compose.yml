# Satu situs WordPress. Database ada di stack ../mysql (MySQL bersama).
#
# Untuk situs tambahan: salin folder ini (misal ke ~/wp-toko), ubah .env
# (COMPOSE_PROJECT_NAME, SITE_NAME, WP_DOMAIN, WP_PORT), lalu ./setup.sh.
#
# - Port hanya di 127.0.0.1; dari internet hanya bisa lewat Cloudflare Tunnel.
# - Ke MySQL lewat network internal `mysql_shared`; password dari file (*_FILE).
# - Container read-only, capability minimal, no-new-privileges, batas RAM/PID.

services:
  wordpress:
    image: wordpress:6-php8.3-apache
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_NAME: wp_${SITE_NAME:?SITE_NAME wajib diisi di .env}
      WORDPRESS_DB_USER: wp_${SITE_NAME}
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:?jalankan ./setup.sh dulu}
      TZ: ${TZ:-Asia/Jakarta}
      # $$ supaya compose tidak menganggap $_SERVER sebagai variabel.
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'https://${WP_DOMAIN:?WP_DOMAIN wajib diisi di .env}');
        define('WP_SITEURL', 'https://${WP_DOMAIN}');
        // HTTPS ditangani Cloudflare; tanpa ini login/CSS bisa redirect berulang.
        if (($$_SERVER['HTTP_X_FORWARDED_PROTO'] ?? '') === 'https') { $$_SERVER['HTTPS'] = 'on'; }
        define('FORCE_SSL_ADMIN', true);
        define('DISALLOW_FILE_EDIT', true);
        define('WP_AUTO_UPDATE_CORE', 'minor');
        define('WP_POST_REVISIONS', 10);
        define('WP_MEMORY_LIMIT', '256M');
        define('WP_DEBUG', false);
        define('WP_DEBUG_DISPLAY', false);
    secrets:
      - db_password
    volumes:
      - wp_data:/var/www/html
      - ./config/php.ini:/usr/local/etc/php/conf.d/zz-hardening.ini:ro
      - ./config/apache-security.conf:/etc/apache2/conf-enabled/zz-security.conf:ro
    tmpfs:
      - /tmp
      - /run/apache2
      - /run/lock/apache2
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, NET_BIND_SERVICE]
    mem_limit: 512m
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:${WP_PORT:?WP_PORT wajib diisi di .env}:80"
    networks:
      - default
      - mysql
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost/wp-includes/images/blank.gif || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  # Network bawaan proyek ini; dipakai untuk akses internet (update plugin/tema).
  default: {}
  # Dibuat oleh stack ../mysql.
  mysql:
    name: mysql_shared
    external: true

volumes:
  wp_data:

secrets:
  db_password:
    file: ./secrets/db_password.txt
